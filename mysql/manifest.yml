apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: roboshop
  labels:
    project: roboshop
    tier: database
    component: mysql
    environment: dev
spec:
  clusterIP: None
  selector:
    project: roboshop
    tier: database
    component: mysql
    environment: dev
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306  
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    tier: database
    component: mysql
    environment: dev
spec:
  selector:
    matchLabels:
      project: roboshop
      tier: database
      component: mysql
      environment: dev # has to match .spec.template.metadata.labels
  serviceName: "mysql-headless"
  #replicas: 4
  replicas: 1 # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        project: roboshop
        tier: database
        component: mysql
        environment: dev # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: mysql
        image: krishna88s/mysql:1.1.0
        volumeMounts:
        - name: mysql
          mountPath: /var/lib/mysql
  #PVC         
  volumeClaimTemplates:
  - metadata:
      name: mysql
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    tier: database
    component: mysql
    environment: dev
spec:
  selector:
    project: roboshop
    tier: database
    component: mysql
    environment: dev
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306          